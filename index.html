<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- carroussels-->
    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <!-- carroussels-->



    <div class="container-fluid px-3">
        <div class="row justify-content-center align-items-center hauteur">

            <div class="col-12 d-flex justify-content-center">

                <form action="" class="blanche form-taille rounded-3 p-4 p-md-5 shadow-lg">

                    <div class="mb-4 text-center">
                        <img src="./Assets/Logo (1).png" alt="Logo" class="img-fluid" style="max-width: 180px;">
                    </div>

                    <h4 class="text-white text-start mb-4">
                        Se Connecter
                    </h4>

                    <div class="mb-3">
                        <label class="text-white mb-2">
                            Email
                        </label>
                        <input type="email" placeholder="email"
                            class="form-control bg-transparent text-white border border-2">
                    </div>

                    <div class="mb-4">
                        <label class="text-white mb-2">
                            Mot de passe
                        </label>
                        <input type="password" placeholder="mot de passe"
                            class="form-control bg-transparent text-white border border-2">
                    </div>

                    <div class="py-3 text-center emation"> <button
                            class="border border-0 py-3 px-0 rounded-3 bacground text-white fw-bold"><a
                                href="./dashboard.html" class="text-decoration-none text-white py-4 px-4 z-2">Se
                                Connecter</a></button> </div>

                    <div class="text-center">
                        <span class="text-white">
                            Ou continuez avec
                        </span>
                    </div>

                    <div class="row justify-content-center g-3 py-4">

                        <div class="col-4 col-md-3">
                            <div class="bacground rounded-3 text-center p-2 social-box">
                                <i class="bi bi-google fs-2 text-white"></i>
                            </div>
                        </div>

                        <div class="col-4 col-md-3">
                            <div class="bacground rounded-3 text-center p-2 social-box">
                                <i class="bi bi-github fs-2 text-white"></i>
                            </div>
                        </div>

                        <div class="col-4 col-md-3">
                            <div class="bacground rounded-3 text-center p-2 social-box">
                                <i class="bi bi-facebook fs-2 text-white"></i>
                            </div>
                        </div>

                    </div>

                    <div class="text-center">
                        <a href="#" class="text-decoration-none text-white small">
                            Si vous n'avez pas de compte, veuillez contacter un administrateur.
                        </a>
                    </div>

                </form>

            </div>

        </div>
    </div>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
